name: CI

on:
  schedule:
    # 每年二月一号执行 北京时间
    - cron: '0 16 1 2 *'
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: pwsh

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: 设置 pnpm
        uses: pnpm/setup@v3

      - name: 设置 Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - run: pnpm install
      - run: pnpm build
      - run: pnpm pack
      - run: pnpm stage publish --access public

      - name: 收集 npm 包
        uses: actions/upload-artifact@v7
        with:
          name: npm-packages
          path: '*.tgz'
          if-no-files-found: error
          retention-days: 3
